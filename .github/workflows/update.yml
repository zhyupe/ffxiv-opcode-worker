name: Update opcodes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test opcode migration
        run: npm test

      - name: Generate validated opcodes from pinned binary diff
        run: npm run json

      - name: Add & Commit
        uses: EndBug/add-and-commit@v9.1.3
        with:
          add: json reports
